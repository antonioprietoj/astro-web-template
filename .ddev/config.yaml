name: astro-web-template

# php type lets DDEV serve dist/ as static files via nginx/Apache.
# For dev, run: ddev npm run dev  (access on host:4321 directly)
type: php
php_version: "8.2"
webserver_type: nginx-fpm
docroot: dist
nodejs_version: "20"

# Expose Astro dev server so it's reachable from the host
web_extra_exposed_ports:
  - name: astro-dev
    container_port: 4321
    http_port: 4321
    https_port: 4322

hooks:
  post-start:
    - exec: "if [ ! -d /var/www/html/node_modules ]; then npm install; fi"
