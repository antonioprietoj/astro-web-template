name: Deploy

on:
  push:
    branches: [main]
    # Only deploy when these paths change (skip on docs-only changes)
    paths-ignore:
      - '**.md'
      - '.cursor/**'

  # Manual trigger with environment choice
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ── SFTP deploy ─────────────────────────────────────
      # Requires these GitHub secrets on each client repo:
      #   SFTP_HOST     — e.g. ftp.cliente.com
      #   SFTP_USER     — FTP/SSH username
      #   SFTP_PASSWORD — FTP/SSH password (or use SFTP_KEY)
      #   SFTP_PORT     — usually 22 (SSH) or 21 (FTP)
      #   SFTP_PATH     — remote path, e.g. /public_html or /www
      #
      # To use SSH key instead of password:
      #   Replace SFTP_PASSWORD with SFTP_KEY (private key contents)
      #   and switch to the ssh-key option below.

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          local_path: ./dist/*
          remote_path: ${{ secrets.SFTP_PATH || '/public_html' }}
          sftp_only: false
          delete_remote_files: true

      # ── Alternative: rsync over SSH ──────────────────────
      # Uncomment and delete the SFTP step above if your host supports SSH:
      #
      # - name: Deploy via rsync
      #   uses: burnett01/rsync-deployments@7.0.1
      #   with:
      #     switches: -avzr --delete
      #     path: dist/
      #     remote_path: ${{ secrets.SFTP_PATH }}
      #     remote_host: ${{ secrets.SFTP_HOST }}
      #     remote_user: ${{ secrets.SFTP_USER }}
      #     remote_key: ${{ secrets.SFTP_KEY }}
